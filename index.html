          '<button onclick="location.reload(true)" style="padding:10px 18px;border-radius:8px;border:none;background:#c8a24a;color:#1a1612;font-size:14px;font-weight:600;cursor:pointer">重新加载</button>' +
          '</div></div>';
      }, 8000);
